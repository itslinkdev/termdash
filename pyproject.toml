[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "termdash"
version = "0.1.0"
description = "A terminal dashboard for system, weather, and Git data"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["textual==8.2.8", "psutil>=7.2.2,<9", "httpx>=0.28,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.14,<1"]

[project.scripts]
termdash = "termdash.__main__:main"

[tool.setuptools.packages.find]
include = ["termdash*"]

[tool.setuptools.package-data]
termdash = ["styles.tcss"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
